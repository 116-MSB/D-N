<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hochzeitsspiel Admin</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:30px;
}

.card{
max-width:1200px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#ff6fa5;
color:white;
}

</style>
</head>
<body>

<div class="card">

<h1>🏆 Hochzeitsspiel Admin</h1>

<button onclick="loadData()">
Teilnehmer laden
</button>

<br><br>

<table>

<thead>
<tr>
<th>Name</th>
<th>Glas 1</th>
<th>Glas 2</th>
<th>Glas 3</th>
<th>Glas 4</th>
<th>Glas 5</th>
</tr>
</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

async function loadData(){

const response = await fetch(
"https://bhbolkpumkmhusenbhcz.supabase.co/rest/v1/guesses?select=*",
{
headers:{
"apikey":"sb_publishable_Y-CZrSOy5hqtydErQP26DA_oZI4ydZw",
"Authorization":"Bearer sb_publishable_Y-CZrSOy5hqtydErQP26DA_oZI4ydZw"
}
}
);

const data = await response.json();

const tableBody =
document.getElementById("tableBody");

tableBody.innerHTML = "";

data.forEach(item => {

tableBody.innerHTML += `
<tr>
<td>${item.guest_name}</td>
<td>${item.glas1}</td>
<td>${item.glas2}</td>
<td>${item.glas3}</td>
<td>${item.glas4}</td>
<td>${item.glas5}</td>
</tr>
`;

});

}

</script>

</body>
</html>
