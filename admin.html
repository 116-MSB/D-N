<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Hochzeitsspiel Admin</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:30px;
}

.card{
max-width:1200px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
margin-bottom:10px;
}

#countBox{
font-size:18px;
margin-bottom:20px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#f06292;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#f06292;
color:white;
}

#winnerBox{
margin-top:25px;
padding:20px;
background:#fff7e6;
border-radius:10px;
}

</style>
</head>
<body>

<div class="card">

<h1>🏆 Hochzeitsspiel Admin</h1>

<p id="countBox">
👥 Teilnehmer: 0
</p>

<button onclick="calculateWinners()">
🏆 Gewinner berechnen
</button>

<div id="winnerBox"></div>

<hr style="margin:25px 0;">

<table>

<thead>
<tr>
<th>Name</th>
<th>Glas 1</th>
<th>Glas 2</th>
<th>Glas 3</th>
<th>Glas 4</th>
<th>Glas 5</th>
</tr>
</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

let participants = [];

async function loadData(){

const response = await fetch(
"https://bhbolkpumkmhusenbhcz.supabase.co/rest/v1/guesses?select=*",
{
headers:{
"apikey":"sb_publishable_Y-CZrSOy5hqtydErQP26DA_oZI4ydZw",
"Authorization":"Bearer sb_publishable_Y-CZrSOy5hqtydErQP26DA_oZI4ydZw"
}
}
);

participants = await response.json();

document.getElementById("countBox").innerText =
"👥 Teilnehmer: " + participants.length;

const tableBody =
document.getElementById("tableBody");

tableBody.innerHTML = "";

participants.forEach(item => {

tableBody.innerHTML += `
<tr>
<td>${item.guest_name}</td>
<td>${item.glas1}</td>
<td>${item.glas2}</td>
<td>${item.glas3}</td>
<td>${item.glas4}</td>
<td>${item.glas5}</td>
</tr>
`;

});

}

function calculateWinners(){

const c1 = 225;
const c2 = 49;
const c3 = 100;
const c4 = 384;
const c5 = 272;

participants.forEach(p => {

p.score =
Math.abs(p.glas1 - c1) +
Math.abs(p.glas2 - c2) +
Math.abs(p.glas3 - c3) +
Math.abs(p.glas4 - c4) +
Math.abs(p.glas5 - c5);

});

participants.sort((a,b) => a.score - b.score);

let html = `
<h2>🏆 Top 5 Gewinner</h2>
<ol>
`;

participants.slice(0,5).forEach((p,index) => {

let medal = "🏅";

if(index === 0) medal = "🥇";
if(index === 1) medal = "🥈";
if(index === 2) medal = "🥉";

html += `
<li>
${medal}
<b>${p.guest_name}</b>
- Abweichung: ${p.score}
</li>
`;

});

html += "</ol>";

document.getElementById("winnerBox").innerHTML = html;

}

loadData();

</script>

</body>
</html>
