<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dominik & Nelly | Hochzeitsschätzspiel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;

background:
linear-gradient(
rgba(0,0,0,0.25),
rgba(0,0,0,0.25)
),
url('./d9e5f6cd-53d2-4e7d-8cfa-e5e9dfe75884.JPG');

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

padding:25px;
}

.card{

width:100%;
max-width:760px;

padding:25px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(6px);

border:1px solid rgba(255,255,255,0.3);

border-radius:30px;

box-shadow:
0 20px 40px rgba(0,0,0,0.15);

color:#fffaf0;

}

h1{

text-align:center;

font-size:4.2rem;
font-weight:700;
letter-spacing:2px;
margin-bottom:15px;
color:white;
text-shadow:0 3px 15px rgba(0,0,0,0.25);
}

.date{

text-align:center;
font-size:1.4rem;
font-weight:300;
letter-spacing:2px;
margin-bottom:30px;
opacity:0.95;
}

.intro{

text-align:center;

line-height:1.7;

font-size:1.1rem;

margin-bottom:35px;

}

.winner{

text-align:center;
font-size:1.6rem;
font-weight:bold;
margin-top:10px;
margin-bottom:30px;
color:#ffd700;
text-shadow:0 0 15px rgba(255,215,0,0.4);

}

input{

width:100%;

padding:16px;

margin-bottom:15px;

border:none;

border-radius:15px;

font-size:16px;

background:
rgba(255,255,255,0.9);

outline:none;

}

input:focus{

box-shadow:
0 0 0 3px rgba(255,105,180,0.3);

}

button{

width:100%;
padding:20px;
border:none;
border-radius:18px;
font-size:20px;
font-weight:bold;
cursor:pointer;
color:white;
background:
linear-gradient(
135deg,
#ff5f9e,
#ffb37d
);
box-shadow:
0 10px 25px rgba(255,111,165,0.35);

transition:0.3s;

}

button:hover{

transform:translateY(-2px);

box-shadow:
0 8px 20px rgba(0,0,0,0.25);

}

.info{

margin-top:25px;

text-align:center;

font-style:italic;

opacity:0.95;

}

.success{

display:none;

background:white;

color:#28a745;

padding:15px;

margin-top:20px;

border-radius:12px;

text-align:center;

font-weight:bold;

}

@media(max-width:768px){

.card{
padding:30px;
}

h1{
font-size:2.2rem;
}

.intro{
font-size:1rem;
}

}

</style>
</head>

<body>

<div class="card">

<h1>Dominik & Nelly</h1>

<div class="date">
01.09.2026
<div class="heartline">♥ ♥ ♥</div>
</div>

<div class="intro">
💍 Schätze die Anzahl der Gegenstände in den fünf Gläsern.
</div>

<div class="winner">
🏆 Die 5 besten Schätzungen gewinnen! 🏆
</div>

<form id="guessForm">

<input id="guest_name" type="text" placeholder="👤 Dein Name" required>

<input id="glas1" type="number" placeholder="🏐 Volleyball-Aufkleber" required>
<input id="glas2" type="number" placeholder="📸 Mini-Kameras" required>
<input id="glas3" type="number" placeholder="✏️ Bleistifte" required>
<input id="glas4" type="number" placeholder="🔧 Autoreifen & Schraubenschlüssel" required>
<input id="glas5" type="number" placeholder="✝️ Kreuze & Bibeln" required>

<button type="submit">
💖 Tipp absenden
</button>

</form>

<div id="successBox" class="success">
✅ Viel Glück!
</div>

<div class="info">
Die Gewinner werden später bekannt gegeben.
</div>

</div>

<script>

document

.getElementById("guessForm")

.addEventListener("submit", async function(e){

e.preventDefault();

if(localStorage.getItem("hochzeit2026")){

alert("Du hast bereits teilgenommen.");

return;

}

const response = await fetch(

"https://bhbolkpumkmhusenbhcz.supabase.co/rest/v1/guesses",

{

method:"POST",

headers:{

"apikey":"sb_publishable_Y-CZrSOy5hqtydErQP26DA_oZI4ydZw",

"Authorization":"Bearer sb_publishable_Y-CZrSOy5hqtydErQP26DA_oZI4ydZw",

"Content-Type":"application/json",

"Prefer":"return=minimal"

},

body:JSON.stringify({

guest_name:document.getElementById("guest_name").value,

glas1:Number(document.getElementById("glas1").value),

glas2:Number(document.getElementById("glas2").value),

glas3:Number(document.getElementById("glas3").value),

glas4:Number(document.getElementById("glas4").value),

glas5:Number(document.getElementById("glas5").value),

total_score:0
})
}
);
if(response.status === 201){
localStorage.setItem("hochzeit2026","true");
document
.getElementById("successBox")
.style.display="block";
document
.getElementById("guessForm")
.reset();
}else{
alert("Fehler beim Speichern. Status: " + response.status)
}
});
</script>

</body>
</html>
